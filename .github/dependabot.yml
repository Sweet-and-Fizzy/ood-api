version: 2

updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grouped, because ungrouped Bundler updates open a PR per gem and the
    # noise gets ignored — which defeats the point. Security fixes come
    # through on their own so they are never buried in a routine batch.
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
      runtime-dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
    # These are held to keep the app installable on Ruby 3.1, the floor the
    # Gemfile states. Their next releases require a later Ruby, so Dependabot
    # would reopen the same PR every week. The Gemfile records why each is
    # pinned; keep these versions in step with its pins, and remove an entry
    # when the floor moves.
    ignore:
      - dependency-name: excon
        versions: [">= 1.7.0"]
      - dependency-name: minitest
        versions: [">= 6.0"]
      - dependency-name: public_suffix
        versions: [">= 7.0"]
      - dependency-name: parallel
        versions: [">= 2.0"]
      - dependency-name: simplecov
        versions: [">= 1.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
