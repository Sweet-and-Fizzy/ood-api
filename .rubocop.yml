# Open OnDemand's own settings, copied from
# https://github.com/OSC/ondemand/blob/master/.rubocop.yml, followed by the
# few exceptions this app needs. Keep the first block in step with upstream.

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'

# --- upstream, plus a test exclusion on the two size metrics: test methods
# build fixtures inline and run longer than application code ---

# style
Style/MultilineBlockChain:
  Enabled: false
Style/HashSyntax:
  EnforcedStyle: 'no_mixed_keys'
Style/ClassAndModuleChildren:
  EnforcedStyle: 'nested'
Style/WordArray:
  EnforcedStyle: 'brackets'
Style/SymbolArray:
  EnforcedStyle: 'brackets'

# layout
Layout/FirstHashElementIndentation:
  EnforcedStyle: 'consistent'
Layout/HashAlignment:
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

# metrics
Metrics/ModuleLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/MethodLength:
  Max: 20
  CountAsOne:
    - 'heredoc'
  Exclude:
    - 'test/**/*'
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/AbcSize:
  Max: 30
  Exclude:
    - 'test/**/*'

# --- exceptions for this app ---

# HTTP status codes in test names are meaningful (401, 503).
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# `op` (operation) and `id` are the domain terms used at every audit and
# lookup call site.
Naming/MethodParameterName:
  AllowedNames:
    - op
    - id

# `ENV['HOME']` is assigned to in test setup, which Dir.home cannot express.
Style/EnvHome:
  Exclude:
    - 'test/**/*'

# Test classes are named for what they cover and carry no class comment,
# as in Open OnDemand's own test suite.
Style/Documentation:
  Exclude:
    - 'test/**/*'
